title: ALEXANDRA MAGAZINE
url: "https://alexandramagazine.github.io"
lang: it

# URL del Cloudflare Worker che pubblica i post (vedi worker/README.md)
worker_url: "https://alexandra-publish.riccardo-lamarca01.workers.dev"

exclude:
  - worker

collections:
  articoli:
    output: true
    permalink: /articoli/:name.html
  blog:
    output: true
    permalink: /blog/:name.html

defaults:
  - scope:
      path: ""
      type: "articoli"
    values:
      layout: articolo
  - scope:
      path: ""
      type: "blog"
    values:
      layout: post
